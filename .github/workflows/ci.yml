name: CI

# The fast gate. It runs exactly what `pnpm verify` runs — CLAUDE.md §3 makes
# any divergence between the two a bug to fix, so this workflow deliberately
# invokes the single script rather than restating its steps.
on:
  pull_request:
  push:
    branches: [main]

# CI is the only judge of quality here (CLAUDE.md §1), so it must never be able
# to write anything. `statuses: read` is what lets the deploy job find the URL
# Netlify published; it grants no write of any kind.
permissions:
  contents: read
  statuses: read

env:
  # Astro prompts for a telemetry decision on first run; CI has no one to ask.
  ASTRO_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck, lint, format, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Third-party actions are pinned by commit SHA, never by moving tag
      # (CLAUDE.md §7). The trailing comment records which tag the SHA was.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm comes from the `packageManager` field, so its version is pinned by
      # the repository rather than by the workflow. Corepack must run before
      # setup-node, which needs the pnpm binary to resolve its cache.
      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm verify

      # Artefacts are the only way to see anything from a cloud session
      # (CLAUDE.md §1), so the coverage report is uploaded even on failure.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
          if-no-files-found: warn

  # The integration layer of CLAUDE.md §5, on a database that exists for the
  # length of this job and is deleted with it.
  #
  # It is the second of the two "chaque push" layers of §5, and it was blocked
  # for a week on a console setting (J1-10). What it buys is more than the
  # seventeen tests it runs: it is the first time in this repository that
  # `drizzle/*.sql` is applied to a **Neon** database by CI rather than to a
  # throwaway Postgres inside a session container (docs/journal.md 014). A
  # migration therefore stops being a file somebody generated and becomes a
  # migration somebody has seen apply, on a copy-on-write clone of production's
  # own default branch, before the pull request is merged.
  #
  # Never production: §7 forbids production's DATABASE_URL in CI outright, and
  # the connection strings below belong to the branch this job just created.
  #
  # NEON_API_KEY is the only secret a pull request job in this repository reads,
  # and it is at repository level for exactly that reason (J1-10) — it creates
  # and deletes throwaway branches and touches no production data.
  integration:
    name: integration (Vitest on an ephemeral Neon branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Neon job and the migration job are TypeScript, and nothing else here
      # compiles them (CLAUDE.md §3).
      - name: Build the jobs
        run: pnpm build:jobs

      # The connection strings leave the job through a file rather than through
      # its stdout: two of them are credentials, and a workflow log is public on
      # a public repository (§7). The job also emits `::add-mask::` for each, so
      # a later step that echoed one would print asterisks.
      #
      # `always()` on the cleanup step below, and a prune inside this one, are
      # two halves of the same concern: a Neon project caps how many branches it
      # may hold, so a leak is not untidiness, it is the next run failing.
      #
      # The branch label reaches the shell through an environment variable
      # rather than through `${{ }}` interpolation: a ref name is attacker-
      # controlled text, and interpolating it into a command line is the
      # classic script injection (§7).
      - name: Create the ephemeral Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          BRANCH_LABEL: ${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "NEON_API_KEY is empty or unreadable."
            echo "Expected on a pull request from a fork: forks get no secrets, so the"
            echo "integration layer cannot run there. See CLAUDE.md §5 and §9."
            exit 1
          fi
          node dist-jobs/jobs/neon-branch.js create \
            --label "$BRANCH_LABEL" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --env-out "$RUNNER_TEMP/neon-branch.env"
          cat "$RUNNER_TEMP/neon-branch.env" >> "$GITHUB_ENV"

      # DATABASE_URL, DATABASE_URL_UNPOOLED, NEON_PROJECT_ID and NEON_BRANCH_ID
      # come from the step above through $GITHUB_ENV, so the three steps below
      # need no `env:` block of their own.
      #
      # The dry run first, and its report uploaded: this is the "migration en
      # dry-run sur une branche Neon éphémère" the definition of done asks of
      # every schema change (CLAUDE.md §6.5). It says what it would apply and
      # writes nothing — and it fails outright if the branch has drifted from
      # this checkout, which is what two parallel branches merged in the wrong
      # order produce.
      - name: Report what the migrations would do
        run: node dist-jobs/jobs/migrate.js --report reports/migrate-dry-run.json

      # Then for real, on the direct endpoint: a migration is a session-level
      # operation and the pooled endpoint is where sessions do not exist (§9).
      - name: Apply the migrations to the branch
        run: node dist-jobs/jobs/migrate.js --apply --report reports/migrate-apply.json

      # The suite connects through DATABASE_URL — the pooled endpoint, as it is
      # on Netlify (§9) — so it exercises the shape the site actually uses.
      - name: Run the integration suite
        run: pnpm test:integration

      # From a cloud-only session an artefact is the only account of what
      # happened to a schema (CLAUDE.md §1), and a run that stopped halfway is
      # the one worth reading.
      - name: Upload the migration reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: migrate-reports
          path: reports/
          retention-days: 7
          if-no-files-found: warn

      # `always()` covers cancellation too, which is the case that matters here:
      # `concurrency: cancel-in-progress` kills the run of every superseded push.
      - name: Delete the ephemeral Neon branch
        if: always() && env.NEON_BRANCH_ID != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ env.NEON_PROJECT_ID }}
        run: node dist-jobs/jobs/neon-branch.js delete --branch "$NEON_BRANCH_ID"

  # `verify` proves the build compiles. It says nothing about what the deployed
  # site actually serves — and for a while it served nothing: Netlify published
  # the Git tree, `/` answered 404, and four pull requests were merged green
  # (docs/journal.md 008). This job is the missing half.
  #
  # It is separate from `verify` on purpose: it depends on a third party, so a
  # Netlify outage must not be able to mask a real `verify` failure.
  #
  # Pull requests only. An earlier version also ran on pushes to main, on the
  # assumption that Netlify posts a commit status for production deploys the way
  # it does for previews. It does not: the run on 7e36ec2 polled for five
  # minutes and saw `0 netlify status(es) seen` throughout. Production is
  # covered by `deploy-production` below, which reads its host from a variable
  # instead of resolving it.
  deploy:
    name: deploy (the preview serves the application)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The deploy URL is read from the commit status Netlify publishes, never
      # written down here: §6 forbids a base URL in the diff, and a hardcoded
      # host would also be wrong on every branch but one.
      - name: Resolve the Netlify deploy URL
        id: netlify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: node scripts/resolve-netlify-url.mjs

      - name: Check the deployment
        run: node scripts/check-deploy.mjs "${{ steps.netlify.outputs.url }}"

  # Accessibility and end-to-end journeys, in a browser, on the same preview.
  #
  # It is not folded into `deploy`, which answers a different question with a
  # different tool: `deploy` reads HTTP responses and asserts the deployment
  # serves the application at all, in seconds and with no browser. This one
  # renders the pages and asserts what a visitor gets. Kept apart, a Playwright
  # failure never has to be untangled from a Netlify outage — and, running side
  # by side, both wait out the same preview build instead of queueing behind
  # each other (§5: under 10 minutes from push to verdict).
  #
  # Pull requests only, as §5 prescribes: "E2E et accessibilité — chaque PR".
  # A merge to main is covered by having run here first.
  e2e:
    name: e2e (Playwright + axe-core on the preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only Chromium: §5 caps this layer at 5 to 8 journeys and one browser,
      # and three engines would triple the slowest layer to re-measure the same
      # markup. The revision is the one @playwright/test pins in the lockfile,
      # so the browser is versioned with the suite rather than with the runner.
      - name: Install the browser Playwright pins
        run: pnpm exec playwright install --with-deps chromium

      # Deliberately after the two installs above: resolving polls until Netlify
      # reports the preview ready, so the wait overlaps with work that has to
      # happen anyway instead of being added to it.
      - name: Resolve the Netlify deploy URL
        id: netlify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: node scripts/resolve-netlify-url.mjs

      - name: Run the end-to-end and accessibility suite
        env:
          BASE_URL: ${{ steps.netlify.outputs.url }}
        run: pnpm test:e2e

      # The report, the screenshots and the traces, uploaded whatever the
      # verdict: from a cloud session they are the only way to see the pages at
      # all (CLAUDE.md §1), and a green run is worth looking at too.
      - name: Upload the Playwright report and traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn

  # The Lighthouse budget CLAUDE.md §6.4 has required since day one, and that
  # did not exist. The brief asks for it twice and calls it "exigence non
  # négociable pour un site qui publie le score des autres" — so the gap was in
  # the repository, not in the sentence.
  #
  # Its own job rather than folded into `e2e`, for the reason `deploy` and `e2e`
  # are already apart: a budget failure must never have to be untangled from a
  # Playwright failure, and both wait out the same preview build in parallel
  # instead of queueing.
  #
  # Pull requests only. What it guards is a regression in a diff, and a merge to
  # main has been through here already.
  lighthouse:
    name: lighthouse (performance budget on the preview)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enable corepack
        run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The revision @playwright/test pins, so the browser is versioned with the
      # repository. The script honours CHROME_PATH for the session container,
      # which carries a different revision; CI sets nothing and gets the pin.
      - name: Install the browser Playwright pins
        run: pnpm exec playwright install --with-deps chromium

      - name: Resolve the Netlify deploy URL
        id: netlify
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: node scripts/resolve-netlify-url.mjs

      - name: Hold the site to its budget
        run: node scripts/lighthouse-budget.mjs "${{ steps.netlify.outputs.url }}"

      # The numbers, whatever the verdict. No session can measure them —
      # `pnpm preview` does not run under the Netlify adapter and a session
      # container cannot reach a public URL — so this artefact is the only
      # instrument the budgets can be set against (CLAUDE.md §1).
      - name: Upload the Lighthouse summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-summary
          path: reports/lighthouse/
          retention-days: 30
          if-no-files-found: warn

  # Production, on pushes to main. There is nothing to resolve here: Netlify
  # posts a commit status for deploy previews but not for production deploys —
  # measured on 7e36ec2, where the resolver polled five minutes and saw zero
  # statuses. The host therefore comes from the SITE_URL Actions variable, which
  # is how it stays out of the diff (§6).
  #
  # It waits for production to serve *this* commit, and that correction was paid
  # for: the earlier version of this comment claimed the job asserted only that
  # production "serves the application", while the script asserted the expected
  # heading and the headers this build adds. On `cabda6a` — the first merge to
  # change the heading — the job met the previous version mid-swap and went red
  # on a healthy site. The script now retries until the expected heading is the
  # one answering, which is the assertion it was making all along.
  deploy-production:
    name: deploy (production serves the application)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the deployment
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "The SITE_URL Actions variable is empty or unset."
            echo "It must hold the production origin — the Netlify host for as long"
            echo "as the custom domain has no DNS records (docs/roadmap.md)."
            exit 1
          fi
          node scripts/check-deploy.mjs "$SITE_URL"

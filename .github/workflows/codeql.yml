name: CodeQL

# Advanced setup rather than GitHub's default setup, deliberately: the default
# keeps its workflow outside the repository, where nothing about it is
# reviewable, pinnable or diffable. In a project whose whole premise is that
# operations must be versioned and inspectable (CLAUDE.md §1), an invisible
# workflow is the wrong default.
#
# CodeQL is NOT a required check yet. §7 asks for it to be enabled on main and
# on pull requests, not for it to block. Making it blocking before observing a
# few real runs would be setting a threshold without a measurement — the exact
# habit the brief argues against elsewhere.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Monday 05:17 UTC. Off the hour on purpose: scheduled jobs pile up at :00
    # and get delayed. The weekly run catches queries added upstream after the
    # last commit — a repository with no activity is not a repository with no
    # vulnerabilities.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze javascript-typescript
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      actions: read
      security-events: write # required to upload the SARIF results

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # No dependency install and no build. The JavaScript/TypeScript extractor
      # reads source directly, and running `pnpm install` first would only hand
      # it node_modules to wade through.
      #
      # Known blind spot: CodeQL has no extractor for `.astro`, so page
      # templates are not analysed at all. Coverage there comes from ESLint
      # (eslint-plugin-astro, jsx-a11y) and from the E2E layer. Written down
      # because a gap nobody named will be mistaken for coverage.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none
          # Default query suite on purpose. `security-extended` finds more and
          # reports more noise; picking it before seeing a baseline would be a
          # guess. Revisit once a few runs are on record.

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9e3211c9a3b9311dfe05da2ed48eea3386f042dd # v4.37.6
        with:
          category: '/language:javascript-typescript'

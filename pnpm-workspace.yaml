# pnpm 10 reads dependency-build policy from here, not from package.json.
# Supply chain (CLAUDE.md §7): no dependency is allowed to run an install
# script. The ignored list is explicit so that a new entry is a reviewable
# decision rather than a silent one.
onlyBuiltDependencies: []
ignoredBuiltDependencies:
  - '@sentry/cli'
  - esbuild
  - sharp

# Overrides force a transitive version the dependency graph would not pick on
# its own. Each entry is a claim that we know better than a package's declared
# range, so each one carries its reason and the condition for removing it.
overrides:
  # GHSA-f88m-g3jw-g9cj — sharp inherits four libvips CVEs (CVE-2026-33327,
  # -33328, -35590, -35591) in every version below 0.35.0. There is no 0.34.x
  # backport, so a range bump cannot reach the fix.
  #
  # astro already declares `^0.34.0 || ^0.35.0`, so this is inside what Astro
  # supports. The package this actually overrides is `ipx@3.1.1` (pulled in by
  # @netlify/images <- @netlify/dev <- @netlify/vite-plugin <- @astrojs/netlify),
  # which caps sharp at `^0.34.3`. That is the risk being accepted, and it is
  # confined to Netlify's image-CDN path — which this site does not use, since
  # it serves no images yet.
  #
  # Remove this entry once ipx ships a release accepting 0.35.
  sharp: ^0.35.3

  # GHSA-2v37-7h3g-55p8 (haute) — nanoid boucle indéfiniment quand un générateur
  # personnalisé reçoit une taille nulle. Tiré par postcss, présent dans le
  # graphe de production. Correctif disponible en 3.3.18, correctif de patch.
  nanoid: ^3.3.18

  # GHSA-q8mj-m7cp-5q26 (modérée) — qs.stringify lève un TypeError sur une
  # entrée nulle en format `comma`. Tiré par typed-rest-client sous
  # @stryker-mutator/core, donc hors du graphe de production. Corrigé quand
  # même : un correctif de patch qui ne coûte rien n'a pas besoin d'un débat.
  qs: ^6.15.2

  # GHSA-67mh-4wv8-2f99 (modérée) — le serveur de développement d'esbuild
  # répond `Access-Control-Allow-Origin: *`. La version atteinte est 0.18.20,
  # tirée par drizzle-kit via @esbuild-kit/*, une chaîne dépréciée que son
  # auteur a fondue dans tsx.
  #
  # **Portée restreinte à cette chaîne, et c'est le point.** Écrit `esbuild:
  # ^0.25.0` sans préfixe, l'override s'applique à tout le graphe : astro et
  # vite résolvent 0.28.1 d'eux-mêmes et se retrouvaient **rétrogradés** en
  # 0.25.12 pour corriger une advisory qui ne les concernait pas. Un override
  # est une affirmation qu'on sait mieux que la plage déclarée par un paquet ;
  # ici on ne le sait que de `@esbuild-kit/core-utils`.
  '@esbuild-kit/core-utils>esbuild': ^0.25.0

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="observatoire-web">
  <!--
    Three ascending bars: a measurement, which is what this site does. No
    wordmark and no invented emblem — the footer says "initiative
    indépendante" (CLAUDE.md §11.6), and an icon that looked official would
    work against that sentence.

    One flat colour, `--link` of src/styles/global.css, which holds contrast on
    both a light and a dark browser tab. No embedded stylesheet and no
    `prefers-color-scheme`: an icon that changes with the theme is a nicety,
    and a second thing to keep in step with the palette.
  -->
  <rect width="32" height="32" rx="6" fill="#1b4fd8"/>
  <rect x="7" y="18" width="4" height="7" rx="1" fill="#ffffff"/>
  <rect x="14" y="13" width="4" height="12" rx="1" fill="#ffffff"/>
  <rect x="21" y="7" width="4" height="18" rx="1" fill="#ffffff"/>
</svg>
